[project]
name = "supersensordoctor"
version = "0.1.0"
description = "SuperSenseDoctor — MultiAgent Collaboration Layer for home-based elderly health tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "jinja2==3.1.5",
  "markdown==3.10.2",
  "openpyxl==3.1.5",
  "python-docx==1.1.2",
  "pandas==2.2.3",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
]
e2e = [
  "playwright==1.49.1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
